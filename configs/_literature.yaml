  measured:
    # Positions supplied by the user as sites of interest for the ESM regression, with no
    # source and no reported effects, so function and abundance stay `unknown` and A19
    # reports where the screen puts them but must NOT score them as a positive control.
    # The wild-type residues below were read off the wild-type sequence recovered from the
    # DMS table's own aa_seq column, so A19/A21 will check them against the data and drop
    # any that disagree.
    - {pos: 59,  wt: L, function: unknown, abundance: unknown, source: "user-supplied, source not stated", confidence: unverified}
    - {pos: 61,  wt: L, function: unknown, abundance: unknown, source: "user-supplied, source not stated", confidence: unverified}
    - {pos: 198, wt: F, function: unknown, abundance: unknown, source: "user-supplied, source not stated", confidence: unverified}
    - {pos: 201, wt: L, function: unknown, abundance: unknown, source: "user-supplied, source not stated", confidence: unverified}
    - {pos: 316, wt: V, function: unknown, abundance: unknown, source: "user-supplied, source not stated", confidence: unverified}
    - {pos: 331, wt: N, function: unknown, abundance: unknown, source: "user-supplied, source not stated", confidence: unverified}
    - {pos: 363, wt: A, function: unknown, abundance: unknown, source: "user-supplied, source not stated", confidence: unverified}
    - {pos: 366, wt: F, function: unknown, abundance: unknown, source: "user-supplied, source not stated", confidence: unverified}
    - {pos: 368, wt: A, function: unknown, abundance: unknown, source: "user-supplied, source not stated", confidence: unverified}
