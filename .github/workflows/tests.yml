name: tests

# The test suite runs on the synthetic fixtures only. No real dataset is in the
# repository (data/ is git-ignored), so CI can never touch unpublished measurements,
# and it is not the place to run an analysis - see scripts/ for that.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # the version requirements.lock is pinned for
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Build the synthetic fixtures
        # Several tests reach for configs/SYN*.yaml, which are generated rather than
        # committed. Without this step they fail on a missing config and the real
        # assertion is never reached. --offline keeps init from touching the network.
        run: |
          python tests/make_synthetic.py
          python -m mpdms init data/raw/SYN1 data/raw/SYN2 data/raw/SYN3 --offline --force

      - name: Run the tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
